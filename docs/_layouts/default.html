<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-site-verification" content="BWApMIBBsK_hOKJBuRTUtVKgj3wVTcayKgDoyjzTk_Q" />
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  
  <!-- Favicon -->
  <link rel="shortcut icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/img/wordmark.png' | relative_url }}" alt="PaDDY wordmark">
      </a>
      <nav class="nav">
        <a href="#features">Features</a>
        <a href="#install">Install</a>
        <a href="#usage">Quick Start</a>
        <a href="#screenshots">Screenshots</a>
        <a href="#changelog">Changelog</a>
        <a href="https://github.com/NoID1290/PaDDY/releases" class="btn-nav">Download</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>PaDDY is licensed under MIT. NoID Softwork - Vincent Leclair © 2020-2026.</p>
      <div class="links">
        <a href="https://github.com/NoID1290/PaDDY">GitHub</a>
        <a href="https://github.com/NoID1290/PaDDY/blob/main/CHANGELOG.md">Changelog</a>
      </div>
    </div>
  </footer>
</body>
</html>
